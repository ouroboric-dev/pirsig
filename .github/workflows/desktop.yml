# desktop — the Tauri app compiles, and its UI works end to end. No bundle, no
# release yet. macOS ships the webview Tauri needs; Linux would need
# webkit2gtk first, so the UI is tested there in Playwright's WebKit instead.
name: desktop

on:
  pull_request:
    paths: ["desktop/**", "src/**", "config/development.yaml", Cargo.toml, Cargo.lock, rust-toolchain.toml, .github/workflows/desktop.yml]
  push:
    branches: [main]
    paths: ["desktop/**", "src/**", "config/development.yaml", Cargo.toml, Cargo.lock, rust-toolchain.toml, .github/workflows/desktop.yml]

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo check --locked --manifest-path desktop/src-tauri/Cargo.toml

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - run: cargo build --locked --bin zettelkasten-cli
      - working-directory: desktop
        run: |
          npm ci
          npx playwright install --with-deps webkit
          npx playwright test
        env:
          CI: "true"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: desktop/test-results
