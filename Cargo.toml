[workspace]
members = ["crates/obsidian-painter", "crates/pirsig-drawings", "crates/pirsig-github", "crates/pirsig-mobile"]
# the Tauri shell builds on its own (it needs a webview); see desktop/README.md
exclude = ["desktop/src-tauri"]

[package]
name = "zettelkasten"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
rust-version = "1.94"
publish = false
default-run = "zettelkasten-cli"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace.dependencies]
loco-rs = { version = "1.2" }

[dependencies]
loco-rs = { workspace = true  }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
tokio = { version = "1.45", default-features = false, features = [
  "rt-multi-thread",
] }
async-trait = { version = "0.1" }
axum = { version = "0.8" }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
regex = { version = "1.11" }
migration = { path = "migration" }
sea-orm = { version = "2.0", features = [
  "sqlx-sqlite",
  "sqlx-postgres",
  "runtime-tokio-rustls",
  "macros",
] }
chrono = { version = "0.4" }
validator = { version = "0.20" }
uuid = { version = "1.6", features = ["v4"] }
# ts-rs derives the TypeScript bindings for the `dtos` (the typed JSON API
# contract). Present for every db app; the SPA frontend consumes the exports,
# and a headless app can still emit them for external consumers.
ts-rs = { version = "12", features = ["chrono-impl", "serde-compat"] }
include_dir = { version = "0.7" }
clap = { version = "4.5", features = ["derive", "env"] }
url = { version = "2.5" }
serde_yaml = { version = "0.9" }
# ingest: RSS/Atom feeds and the arXiv API (Atom)
feed-rs = { version = "2" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# pirsig.toml, and `psg bootstrap repo`: a fork state out of a GitHub tarball
toml = { version = "0.8" }
flate2 = { version = "1" }
tar = { version = "0.4" }
# psg bootstrap gh: what to index from GitHub, and how little of a private repo
pirsig-github = { path = "crates/pirsig-github" }

[[bin]]
name = "zettelkasten-cli"
path = "src/bin/main.rs"
required-features = []

[[bin]]
name = "psg"
path = "src/bin/psg.rs"

[dev-dependencies]
loco-rs = { workspace = true, features = ["testing"] }
serial_test = { version = "3.1.1" }
rstest = { version = "0.25" }
insta = { version = "1.34", features = ["redactions", "yaml", "filters"] }

# the Obsidian plugin ships this crate as WebAssembly: small beats fast
[profile.release.package.obsidian-painter]
opt-level = "s"

[profile.release.package.pirsig-mobile]
opt-level = "s"
